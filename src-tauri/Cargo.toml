[package]
name = "vitrum"
version = "0.3.0"
description = "Lecteur et editeur Markdown"
edition = "2021"

[lib]
name = "vitrum_lib"
crate-type = ["rlib"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
comrak = { version = "0.59.0", default-features = false }
dunce = "1.0.5"
notify = "8.2.2"
notify-debouncer-mini = "0.7.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
yaml-rust2 = "0.13.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

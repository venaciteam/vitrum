# Fabrication de SECOURS de Vitrum : .dmg universel pour macOS, installateur NSIS pour Windows.
#
# Les versions se fabriquent normalement sur les machines (scripts/publier.sh sur le Mac,
# scripts/publier.ps1 sur le PC, voir « Publier une version » dans le README). Ce workflow ne
# part qu'à la main : onglet Actions › build › Run workflow.
# - Par défaut : fabrication d'essai, fichiers en artefacts (gardés 30 jours).
# - Option « publier » : publie aussi la version de tauri.conf.json (vX.Y.Z), avec des fichiers
#   aux noms fixes attendus par les liens « dernière version » du README : Vitrum-Setup.exe et
#   Vitrum-macOS.dmg (ici universel : Apple Silicon et Intel).
#
# Aucun déclenchement automatique : les minutes macOS comptent dix fois sur un dépôt privé.
name: build

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier la version de tauri.conf.json (sinon : essai, fichiers en artefacts)"
        type: boolean
        default: false

permissions:
  contents: read

# Une nouvelle fabrication du même ref annule celle encore en cours.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Les runners Apple Silicon manquent souvent de place ; un runner Intel
    # fabrique le même binaire universel (Apple Silicon + Intel).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Versions identiques
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          P=$(node -p "require('./package.json').version")
          C=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$V" = "$P" ] && [ "$V" = "$C" ] || { echo "tauri.conf.json $V, package.json $P, Cargo.toml $C"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - name: Tests du cœur
        working-directory: src-tauri
        run: cargo test --locked
      - name: Fabrication (.app + .dmg universels)
        run: npx tauri build --target universal-apple-darwin
      - name: Fichier à publier
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Vitrum-macOS.dmg
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: vitrum-macos
          path: out/Vitrum-macOS.dmg
          if-no-files-found: error
          # Le stockage des artefacts d'un compte est limité : 30 jours suffisent.
          retention-days: 30

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Versions identiques
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          P=$(node -p "require('./package.json').version")
          C=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          [ "$V" = "$P" ] && [ "$V" = "$C" ] || { echo "tauri.conf.json $V, package.json $P, Cargo.toml $C"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - name: Tests du cœur
        working-directory: src-tauri
        run: cargo test --locked
      - name: Fabrication (installateur NSIS)
        run: npx tauri build
      - name: Fichier à publier
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/Vitrum-Setup.exe
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: vitrum-windows
          path: out/Vitrum-Setup.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publication
    if: inputs.publier
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$V"
          ls -l out
          sha256sum out/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Vitrum $V" --notes "Vitrum $V." --latest
          fi
